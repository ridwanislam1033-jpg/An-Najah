.fh{margin:26px 0 8px;font-size:1.1rem}

.view{display:none}.view.on{display:block}
.wrap{padding-bottom:96px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}

.nav span{font-size:1.3rem;line-height:1}

.bdg{position:static;background:#c0392b;color:#fff;border-radius:10px;font-size:.72rem;min-width:18px;padding:0 5px;line-height:18px;display:none;font-weight:700}
</style>
</head>

}
async function setStatus(q,st){
  var r=await fetch(URL0+"/rest/v1/payment_requests?id=eq."+q.id,{method:"PATCH",headers:hdr(S.access_token,{"Prefer":"return=minimal"}),body:JSON.stringify({status:st})});
  return r.ok;
}
async function decide(q,yes,ok,no){
  var note=$("note");ok.disabled=true;no.disabled=true;
  try{
    if(yes){
      var m=D.members.find(function(x){return x.name===q.member_name});
      if(!m){note.textContent="সদস্য '"+q.member_name+"' তালিকায় পাওয়া যায়নি (নাম বদলেছে?)। হাতে লিখে দিন, তারপর বাতিল করুন।";ok.disabled=false;no.disabled=false;return}
      if(q.year!==D.year){note.textContent="আবেদনটি "+q.year+" সালের, পেজে এখন অন্য সাল। সাল মিলিয়ে নিন।";ok.disabled=false;no.disabled=false;return}
      var before=m.paid[q.month];
      m.paid[q.month]=(+before||0)+Number(q.amount);
      if(!(await saveLedger())){
        if(before)m.paid[q.month]=before;else delete m.paid[q.month];
        note.textContent="সংরক্ষণ হয়নি, আবার চেষ্টা করুন।";ok.disabled=false;no.disabled=false;render();return}
    }
    if(!(await setStatus(q,yes?"confirmed":"rejected")))throw 0;
  }catch(e){note.textContent="কাজটি শেষ হয়নি। লগআউট করে আবার লগইন করে চেষ্টা করুন।"}
  await loadReq();render();
}

async function saveLedger(){
  D.updated=new Date().toLocaleString("bn-BD",{dateStyle:"medium",timeStyle:"short"});
  try{
    var r=await fetch(URL0+"/rest/v1/ledger?id=eq.1",{method:"PATCH",headers:hdr(S.access_token,{"Prefer":"return=representation"}),body:JSON.stringify({data:D,updated_at:new Date().toISOString()})});
    var j=await r.json();
    if(!r.ok||!j.length)return false;
    dirty=false;return true;
  }catch(e){return false}
}
async function saveClick(){
  var s=$("save");s.disabled=true;s.textContent="সংরক্ষণ হচ্ছে…";
  if(await saveLedger()){s.textContent="সংরক্ষিত হয়েছে";setTimeout(render,1200)}
  else{s.disabled=false;s.textContent="সংরক্ষণ করে সবাইকে আপডেট দিন";$("note").textContent="সংরক্ষণ হয়নি। লগআউট করে আবার লগইন করে চেষ্টা করুন।"}
}

$("showlogin").onclick=function(){$("login").style.display="block"};
$("dologin").onclick=async function(){
  var e=$("em").value.trim(),p=$("pw").value,er=$("lerr");er.textContent="";
  try{
    var r=await fetch(URL0+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})});
    var j=await r.json();
    if(!r.ok||!j.access_token)throw new Error("x");
    S={access_token:j.access_token,exp:Date.now()+(j.expires_in||3600)*1000-60000};
    try{localStorage.setItem("annajah_s",JSON.stringify(S))}catch(x){}
    render();loadReq();
  }catch(x){er.textContent="ইমেইল বা পাসওয়ার্ড ভুল।"}
};
setInterval(function(){if(!dirty&&!document.hidden)load()},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!dirty)load()});
$("t1").onclick=function(){show(1)};$("t2").onclick=function(){show(2)};
render();load();
})();
</script>
