<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f6b4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>আন-নাজাহ সমিতি</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2a24;--mute:#6b766f;--line:#e3ded2;--brand:#1f6b4f;--brand-ink:#fff;--paid:#e4f3ea;--head:#efe9da;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--ink:#e8efe9;--mute:#9aa79f;--line:#2f3b35;--brand:#4fbf93;--brand-ink:#0e1a14;--paid:#1f3a2e;--head:#26322b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--ink:#e8efe9;--mute:#9aa79f;--line:#2f3b35;--brand:#4fbf93;--brand-ink:#0e1a14;--paid:#1f3a2e;--head:#26322b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
h1{margin:0;font-size:1.7rem;color:var(--brand)}
.sub{color:var(--mute);margin:2px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.c b{display:block;font-size:1.35rem}
.c span{color:var(--mute);font-size:.85rem}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap;font-size:.95rem}
th{background:var(--head);font-weight:600;position:sticky;top:0}
td:first-child,th:first-child{position:sticky;left:0;text-align:left;background:var(--card);z-index:1;min-width:130px;font-weight:600}
th:first-child{background:var(--head)}
td.p{background:var(--paid)}
td.z{color:var(--mute)}
tfoot td{background:var(--head);font-weight:700}
tfoot td:first-child{background:var(--head)}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
td input[type=number]{width:72px;text-align:center}
td input.nm{width:120px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
button{font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
button:disabled{opacity:.5}
.note{color:var(--mute);font-size:.88rem}
.yr{width:90px;text-align:center}
button.x{padding:2px 8px;margin-left:6px;background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:400}
button.add{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.ft{min-width:0}
.fh{margin:26px 0 8px;font-size:1.1rem}
button.sm{padding:3px 10px;margin:0 3px;background:transparent;color:var(--brand);border:1px solid var(--line);font-weight:400;font-size:.85rem}

.lg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0;display:none;max-width:420px}
.lg input{display:block;width:100%;margin:6px 0 10px;padding:9px}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;font-weight:400;padding:4px 0;font-size:.85rem}
.err{color:#c0392b;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>আন-নাজাহ সমিতি</h1>
  <p class="sub" id="sub"></p>
  <div class="cards" id="cards"></div>
  <div class="tw"><div id="app"></div></div>
  <div id="former"></div>
  <div class="bar" id="bar"></div>
  <p class="note" id="note">লোড হচ্ছে…</p>
  <div id="lnkwrap" style="display:none"><button class="lnk" id="showlogin">কোষাধ্যক্ষ লগইন</button></div>
  <div class="lg" id="login">
    <label>ইমেইল<input id="em" type="email" autocomplete="username"></label>
    <label>পাসওয়ার্ড<input id="pw" type="password" autocomplete="current-password"></label>
    <button id="dologin">লগইন</button>
    <p class="err" id="lerr"></p>
  </div>
</div>
<script>
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
(function(){
var URL0="https://aqosirimziitssudxaat.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxb3NpcmltemlpdHNzdWR4YWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNzg3MDgsImV4cCI6MjEwOTg1NDcwOH0.xBvmoqcDZ_mo3rarENHYmF8AkRHPkwyz5-VsyKuaVMc";
var MONTHS=["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টে","অক্টো","নভে","ডিসে"];
var D={year:new Date().getFullYear(),updated:"",members:[],former:[]};
var S=null,dirty=false,loaded=false;
try{S=JSON.parse(localStorage.getItem("annajah_s")||"null")}catch(e){}
var bn=function(n){return Number(n||0).toLocaleString("bn-BD")};
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function editor(){return !!(S&&S.access_token&&S.exp>Date.now())}
function hdr(tok){return {"apikey":KEY,"Authorization":"Bearer "+(tok||KEY),"Content-Type":"application/json"}}

async function load(){
  try{
    var r=await fetch(URL0+"/rest/v1/ledger?id=eq.1&select=data",{headers:hdr()});
    var j=await r.json();
    if(j&&j[0]&&j[0].data){D=j[0].data;D.former=D.former||[];loaded=true}
    else if(!loaded)$("note").textContent="তথ্য পাওয়া যায়নি।";
  }catch(e){if(!loaded)$("note").textContent="ইন্টারনেট সংযোগ দেখুন, তারপর পেজ রিফ্রেশ করুন।"}
  render();
}
function mark(){dirty=true;var s=$("save");if(s)s.disabled=false}

function render(){
  var total=0,colT=new Array(12).fill(0);
  D.members.forEach(function(m){for(var k=0;k<12;k++){var v=+m.paid[k]||0;colT[k]+=v;total+=v}});
  $("sub").textContent="সদস্য "+bn(D.members.length)+" জন • সাল "+String(D.year).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})+(D.updated?" • সর্বশেষ আপডেট: "+D.updated:"");
  var cards=$("cards");cards.textContent="";var thisM=new Date().getMonth();
  [["মোট জমা","৳ "+bn(total)],["চলতি মাসে জমা ("+MONTHS[thisM]+")","৳ "+bn(colT[thisM])],["সদস্য",bn(D.members.length)+" জন"]].forEach(function(a){
    var c=el("div","c");c.appendChild(el("b","",a[1]));c.appendChild(el("span","",a[0]));cards.appendChild(c)});
  var ed=editor(),app=$("app");app.textContent="";
  var t=el("table"),h=el("thead"),hr=el("tr");
  hr.appendChild(el("th","","সদস্যের নাম"));MONTHS.forEach(function(m){hr.appendChild(el("th","",m))});hr.appendChild(el("th","","মোট"));h.appendChild(hr);t.appendChild(h);
  var b=el("tbody");
  D.members.forEach(function(m,i){
    var tr=el("tr"),td=el("td");
    if(ed){var ni=el("input","nm");ni.value=m.name;ni.oninput=function(){m.name=ni.value;mark()};td.appendChild(ni);
      var xb=el("button","x","✕");xb.title="প্রাক্তন সদস্য করুন";xb.onclick=function(){var r=D.members.splice(i,1)[0];D.former.push({name:r.name,paid:r.paid,refunded:0});mark();render()};td.appendChild(xb)}
    else td.textContent=m.name;
    tr.appendChild(td);var sum=0;
    for(var k=0;k<12;k++){var v=+m.paid[k]||0;sum+=v;var c=el("td",v?"p":"z");
      if(ed){var inp=el("input");inp.type="number";inp.inputMode="numeric";inp.min="0";inp.value=v||"";inp.placeholder="০";
        (function(m,k,inp){inp.onchange=function(){var x=parseFloat(inp.value);if(x>0)m.paid[k]=x;else delete m.paid[k];mark();render()}})(m,k,inp);c.appendChild(inp)}
      else c.textContent=v?bn(v):"—";tr.appendChild(c)}
    tr.appendChild(el("td","",bn(sum)));b.appendChild(tr)});
  t.appendChild(b);
  var f=el("tfoot"),fr=el("tr");fr.appendChild(el("td","","মাসের মোট"));colT.forEach(function(v){fr.appendChild(el("td","",bn(v)))});fr.appendChild(el("td","",bn(total)));f.appendChild(fr);t.appendChild(f);app.appendChild(t);

  var fw=$("former");fw.textContent="";var F=D.former||[];
  if(F.length){
    fw.appendChild(el("h2","fh","প্রাক্তন সদস্য ও টাকা ফেরত"));
    var w=el("div","tw"),ft=el("table","ft"),fhd=el("thead"),fhr=el("tr");
    ["নাম","মোট জমা","ফেরত দেওয়া","বাকি ফেরত"].concat(ed?[""]:[]).forEach(function(x){fhr.appendChild(el("th","",x))});
    fhd.appendChild(fhr);ft.appendChild(fhd);var fb=el("tbody");
    F.forEach(function(m,j){
      var s=0;for(var k in m.paid)s+=+m.paid[k]||0;
      var tr=el("tr");tr.appendChild(el("td","",m.name));tr.appendChild(el("td","",bn(s)));var rc=el("td");
      if(ed){var ri=el("input");ri.type="number";ri.inputMode="numeric";ri.min="0";ri.value=m.refunded||"";ri.placeholder="০";ri.onchange=function(){m.refunded=Math.max(0,parseFloat(ri.value)||0);mark();render()};rc.appendChild(ri)}else rc.textContent=bn(m.refunded);
      tr.appendChild(rc);var due=s-(+m.refunded||0);
      tr.appendChild(el("td",due>0?"":"p",due>0?bn(due):due===0?"✔ পরিশোধিত":"বেশি দেওয়া হয়েছে"));
      if(ed){var ac=el("td");
        var rb=el("button","sm","↩ ফিরিয়ে আনুন");rb.onclick=function(){D.members.push({name:m.name,paid:m.paid});F.splice(j,1);mark();render()};
        var db=el("button","sm","✕ তালিকা থেকে সরান");db.onclick=function(){F.splice(j,1);mark();render()};
        ac.appendChild(rb);ac.appendChild(db);tr.appendChild(ac)}
      fb.appendChild(tr)});
    ft.appendChild(fb);w.appendChild(ft);fw.appendChild(w)}

  var bar=$("bar"),note=$("note");bar.textContent="";
  if(ed){
    bar.appendChild(el("span","","সাল:"));var yi=el("input","yr");yi.type="number";yi.value=D.year;yi.onchange=function(){D.year=+yi.value||D.year;mark();render()};bar.appendChild(yi);
    var ab=el("button","add","＋ সদস্য যোগ");ab.onclick=function(){D.members.push({name:"নতুন সদস্য",paid:{}});mark();render()};bar.appendChild(ab);
    var sb=el("button","","✔ সংরক্ষণ করে সবাইকে আপডেট দিন");sb.id="save";sb.disabled=!dirty;sb.onclick=save;bar.appendChild(sb);
    var lo=el("button","lnk","লগআউট");lo.onclick=function(){S=null;try{localStorage.removeItem("annajah_s")}catch(e){}dirty=false;load()};bar.appendChild(lo);
    note.textContent="আপনি কোষাধ্যক্ষ হিসেবে সম্পাদনা করছেন। সংরক্ষণ চাপলে সবার পেজে নতুন তথ্য দেখা যাবে।";
    $("lnkwrap").style.display="none";$("login").style.display="none";
  }else{note.textContent="এই পেজটি শুধু দেখার জন্য। কোষাধ্যক্ষ আপডেট করলে এখানে নতুন তথ্য দেখা যাবে।";$("lnkwrap").style.display="block"}
}

async function save(){
  var s=$("save");s.disabled=true;s.textContent="সংরক্ষণ হচ্ছে…";
  D.updated=new Date().toLocaleString("bn-BD",{dateStyle:"medium",timeStyle:"short"});
  try{
    var r=await fetch(URL0+"/rest/v1/ledger?id=eq.1",{method:"PATCH",headers:Object.assign(hdr(S.access_token),{"Prefer":"return=representation"}),body:JSON.stringify({data:D,updated_at:new Date().toISOString()})});
    var j=await r.json();
    if(!r.ok||!j.length)throw new Error("no");
    dirty=false;s.textContent="✔ সংরক্ষিত হয়েছে";setTimeout(render,1200);
  }catch(e){s.disabled=false;s.textContent="✔ সংরক্ষণ করে সবাইকে আপডেট দিন";$("note").textContent="সংরক্ষণ হয়নি। লগআউট করে আবার লগইন করে চেষ্টা করুন।"}
}

$("showlogin").onclick=function(){$("login").style.display="block"};
$("dologin").onclick=async function(){
  var e=$("em").value.trim(),p=$("pw").value,er=$("lerr");er.textContent="";
  try{
    var r=await fetch(URL0+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})});
    var j=await r.json();
    if(!r.ok||!j.access_token)throw new Error("x");
    S={access_token:j.access_token,exp:Date.now()+(j.expires_in||3600)*1000-60000};
    try{localStorage.setItem("annajah_s",JSON.stringify(S))}catch(x){}
    render();
  }catch(x){er.textContent="ইমেইল বা পাসওয়ার্ড ভুল।"}
};
setInterval(function(){if(!dirty&&!document.hidden)load()},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!dirty)load()});
render();load();
})();
</script>
</body>
</html>
